spring:
  application:
    name: brooks-backend
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_MAX:20}
      minimum-idle: ${DB_POOL_MIN:5}
      connection-timeout: 10000
      idle-timeout: 300000
      max-lifetime: 1200000
      leak-detection-threshold: 30000
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          batch_size: 25
          batch_versioned_data: true
        order_inserts: true
        order_updates: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    ignore-migration-patterns:
      - "*:missing"
  servlet:
    multipart:
      max-file-size: ${MEDIA_MAX_UPLOAD_SIZE_MB:10}MB
      max-request-size: ${MEDIA_MAX_UPLOAD_SIZE_MB:10}MB
  # Per-cache Caffeine specs are defined in com.brooks.app.config.CacheConfig.
  # We don't use spring.cache.cache-names here because each cache has its own size/TTL.
  cache:
    type: caffeine

server:
  port: 8080

auth0:
  domain: ${AUTH0_DOMAIN:brooks.auth0.com}
  audience: ${AUTH0_AUDIENCE:https://api.brooks-prequel.com}

app:
  base-url: ${APP_BASE_URL:http://localhost:8080}
  frontend-base-url: ${FRONTEND_BASE_URL:http://localhost:3000}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:3001}
  admin-emails: ${ADMIN_EMAILS:}
  async:
    ai:
      core-pool-size: ${AI_ASYNC_CORE_POOL_SIZE:2}
      max-pool-size: ${AI_ASYNC_MAX_POOL_SIZE:8}
      queue-capacity: ${AI_ASYNC_QUEUE_CAPACITY:32}
      max-concurrent-streams-per-user: ${AI_MAX_CONCURRENT_STREAMS_PER_USER:2}
    notification:
      core-pool-size: ${NOTIFICATION_ASYNC_CORE_POOL_SIZE:2}
      max-pool-size: ${NOTIFICATION_ASYNC_MAX_POOL_SIZE:4}
      queue-capacity: ${NOTIFICATION_ASYNC_QUEUE_CAPACITY:256}
  seed:
    example:
      enabled: ${SEED_EXAMPLE_ENABLED:false}
      auth0-subject: ${SEED_EXAMPLE_AUTH0_SUBJECT:}
      email: ${SEED_EXAMPLE_EMAIL:}
      username: ${SEED_EXAMPLE_USERNAME:}
      display-name: ${SEED_EXAMPLE_DISPLAY_NAME:}
      bio: ${SEED_EXAMPLE_BIO:}
      avatar-url: ${SEED_EXAMPLE_AVATAR_URL:}
      region: ${SEED_EXAMPLE_REGION:}
      interests: ${SEED_EXAMPLE_INTERESTS:}
      latitude: ${SEED_EXAMPLE_LATITUDE:}
      longitude: ${SEED_EXAMPLE_LONGITUDE:}
      follower-count: ${SEED_EXAMPLE_FOLLOWER_COUNT:}
      following-count: ${SEED_EXAMPLE_FOLLOWING_COUNT:}
      verified: ${SEED_EXAMPLE_VERIFIED:}
      guide-title: ${SEED_EXAMPLE_GUIDE_TITLE:}
      guide-summary: ${SEED_EXAMPLE_GUIDE_SUMMARY:}
      guide-city: ${SEED_EXAMPLE_GUIDE_CITY:}
      guide-country: ${SEED_EXAMPLE_GUIDE_COUNTRY:}
      guide-cover-image-url: ${SEED_EXAMPLE_GUIDE_COVER_IMAGE_URL:}
      guide-price-cents: ${SEED_EXAMPLE_GUIDE_PRICE_CENTS:}
      guide-currency: ${SEED_EXAMPLE_GUIDE_CURRENCY:}
      guide-tags: ${SEED_EXAMPLE_GUIDE_TAGS:}
      day-title: ${SEED_EXAMPLE_DAY_TITLE:}
      day-description: ${SEED_EXAMPLE_DAY_DESCRIPTION:}
      block-title: ${SEED_EXAMPLE_BLOCK_TITLE:}
      block-description: ${SEED_EXAMPLE_BLOCK_DESCRIPTION:}
      block-type: ${SEED_EXAMPLE_BLOCK_TYPE:}
      place-name: ${SEED_EXAMPLE_PLACE_NAME:}
      place-description: ${SEED_EXAMPLE_PLACE_DESCRIPTION:}
      place-address: ${SEED_EXAMPLE_PLACE_ADDRESS:}
      place-latitude: ${SEED_EXAMPLE_PLACE_LATITUDE:}
      place-longitude: ${SEED_EXAMPLE_PLACE_LONGITUDE:}
      place-category: ${SEED_EXAMPLE_PLACE_CATEGORY:}
      place-price-level: ${SEED_EXAMPLE_PLACE_PRICE_LEVEL:}
      place-image-url: ${SEED_EXAMPLE_PLACE_IMAGE_URL:}
  social:
    story-expiry-hours: ${STORY_EXPIRY_HOURS:24}
  ranking:
    weekly-purchase-weight: ${RANKING_WEEKLY_PURCHASE_WEIGHT:2}
    popular-this-week-threshold: ${RANKING_POPULAR_THIS_WEEK_THRESHOLD:5}
  platform-fee-percent: ${PLATFORM_FEE_PERCENT:10}
  place-image-max-count: ${PLACE_IMAGE_MAX_COUNT:5}
  payout-schedule-cron: ${PAYOUT_SCHEDULE_CRON:0 0 2 * * MON}
  ranking-refresh-cron: ${RANKING_REFRESH_CRON:0 0 3 * * *}
  maps:
    # Hard cap on creator pins returned by /api/maps/influencers. Bounds the
    # client's DOM-marker + avatar-image set so the Android WebView can't OOM.
    influencer-pins:
      max: ${MAPS_INFLUENCER_PINS_MAX:500}
  memory:
    unlock-radius-meters: ${MEMORY_UNLOCK_RADIUS_METERS:100}
    daily-create-limit: ${MEMORY_DAILY_CREATE_LIMIT:25}
    blocked-terms: ${MEMORY_BLOCKED_TERMS:}

ai:
  key-encryption-secret: ${AI_KEY_ENCRYPTION_SECRET}

calendar:
  token-encryption-secret: ${CALENDAR_TOKEN_ENCRYPTION_SECRET:${AI_KEY_ENCRYPTION_SECRET}}
  google:
    client-id: ${GOOGLE_CALENDAR_CLIENT_ID:}
    client-secret: ${GOOGLE_CALENDAR_CLIENT_SECRET:}
    calendar-name: ${GOOGLE_CALENDAR_NAME:Brooks Trips}

bog-ipay:
  client-id: ${BOG_IPAY_CLIENT_ID:}
  secret-key: ${BOG_IPAY_SECRET_KEY:}
  oauth-base-url: ${BOG_IPAY_OAUTH_URL:https://oauth2.bog.ge}
  api-base-url: ${BOG_IPAY_API_URL:https://api.bog.ge}
  callback-path: ${BOG_IPAY_CALLBACK_PATH:/api/webhooks/bog-ipay}
  locale: ${BOG_IPAY_LOCALE:ka}
  order-ttl-minutes: ${BOG_IPAY_ORDER_TTL_MINUTES:30}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  metrics:
    tags:
      application: brooks-backend

logging:
  level:
    com.brooks: INFO
  # Prepend [requestId=...] to every log line so backend logs from a single HTTP
  # request can be correlated. The filter that populates this MDC key is
  # com.brooks.common.web.RequestIdFilter; outside its scope the field is empty.
  pattern:
    console: "%clr(%d{${LOGGING.PATTERN.DATEFORMAT:yyyy-MM-dd HH:mm:ss.SSS}}){faint} %clr(%5p) %clr([requestId=%X{requestId:-}]){faint} %clr(${PID:- }){magenta} %clr(---){faint} %clr([%15.15t]){faint} %clr(%-40.40logger{39}){cyan} %clr(:){faint} %m%n%wEx"
