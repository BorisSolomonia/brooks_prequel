apply plugin: 'com.android.application'

// Load upload-keystore credentials from key.properties if present. The file is
// gitignored and lives at web/android/key.properties. Absence is tolerated so
// that debug builds and `./gradlew assembleDebug` keep working without it.
def keystorePropertiesFile = rootProject.file("key.properties")
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace "uk.brooksweb.app"
    compileSdk rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "uk.brooksweb.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        // Increment versionCode by 1 on every Play upload. versionName is the
        // user-facing string and can stay constant across patch releases.
        versionCode 28
        versionName "1.2.8"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        release {
            // Pulled from key.properties at build time. If the file is absent
            // (e.g. running ./gradlew assembleDebug before keystore exists),
            // these stay null and Gradle falls back to the debug signing key.
            def storeFilePath = keystoreProperties['storeFile']
            if (storeFilePath) {
                storeFile file(storeFilePath)
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
            }
        }
    }
    buildTypes {
        release {
            // Only attach the upload signing config when the keystore is wired
            // up; otherwise leave the release type signed with the debug key so
            // the build itself doesn't fail before key.properties is created.
            // `./gradlew bundleRelease` will then produce an unsigned-by-upload
            // AAB that Play Console rejects — the intended guardrail.
            if (keystoreProperties['storeFile']) {
                signingConfig signingConfigs.release
            }
            // R8 minification + obfuscation for release builds. Required for
            // Play Store policy and to make sensitive strings (API endpoints,
            // logic) less trivial to reverse-engineer from the APK. Debug
            // builds stay unminified for chrome://inspect WebView debugging.
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
