<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Brooks — offline</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #F7F1E7;
        --fg: #161311;
        --muted: #6E6258;
        --brand: #C95A7D;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #0E0E0E;
          --fg: #E5E5E5;
          --muted: #A0A0A0;
        }
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--fg);
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
      }
      .panel {
        max-width: 360px;
        text-align: center;
      }
      h1 {
        font-weight: 900;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--brand);
        font-size: 22px;
        margin: 0 0 16px;
      }
      p { color: var(--muted); line-height: 1.5; margin: 0 0 12px; }
      button {
        margin-top: 16px;
        padding: 12px 24px;
        border: 2px solid var(--brand);
        background: var(--brand);
        color: #FFF8EF;
        font-weight: 800;
        border-radius: 8px;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div class="panel">
      <h1>Brooks</h1>
      <p>You appear to be offline.</p>
      <p>Check your connection and try again.</p>
      <button type="button" onclick="location.href='https://brooksweb.uk'">Retry</button>
    </div>
  </body>
</html>
