# Brooks Postgres tuning — sized for a single 1 GB Postgres container on a GCP VM with
# pd-balanced (SSD) persistent disk. If the container mem_limit changes, scale shared_buffers
# and effective_cache_size proportionally.

# === Memory ===
shared_buffers = 256MB                  # ~25% of container RAM, the standard Postgres rule.
effective_cache_size = 768MB            # Hint to the planner about OS page cache size.
work_mem = 16MB                         # Per sort/hash op. With Hikari pool=20 and ~3 ops
                                        #   per query worst case, peak ≈ 1 GB total — fits.
maintenance_work_mem = 128MB            # For VACUUM, CREATE INDEX, REINDEX.

# === Storage / I/O assumptions ===
random_page_cost = 1.1                  # SSD; default 4.0 is for spinning disks.
effective_io_concurrency = 200          # SSD can service many concurrent I/Os.

# === WAL / checkpointing ===
max_wal_size = 2GB                      # Reduce checkpoint frequency under write bursts.
min_wal_size = 80MB
checkpoint_completion_target = 0.9      # Spread checkpoint writes across the interval to
                                        #   avoid I/O spikes that show up as latency.

# === Observability ===
shared_preload_libraries = 'pg_stat_statements'
pg_stat_statements.max = 10000
pg_stat_statements.track = all          # Track nested statements (calls inside functions).
track_io_timing = on                    # Per-query I/O wait shown in pg_stat_statements.

# === Logging — only the slow stuff ===
log_min_duration_statement = 500ms      # Anything taking ≥500 ms goes in the postgres log.
log_lock_waits = on                     # Diagnose row-lock contention.
log_temp_files = 10MB                   # Find queries spilling to temp files (tune work_mem).

# === Connections — match Hikari maximumPoolSize plus headroom for psql/Flyway ===
max_connections = 100
