name: Deploy

# Builds arm64 images on GitHub's ARM runners and ships them to the Oracle VM over SSH.
# No registry: the image goes as a `docker save` stream, and Oracle's gate script only
# accepts Brooks's own image names. The runtime env file stays on Oracle; this workflow
# never sends it. Tests run in ci.yml, as before.
#
# The web build still reads its public build values (API URL, Mapbox, GCS bucket) from
# GCP Secret Manager, so GCP_SA_KEY / GCP_PROJECT_ID / GCP_ENV_SECRET_NAME stay as secrets.
#
# Rollback: run this workflow by hand with `tag` set to an earlier tag (e.g. 48120fd-arm64).
# That skips the build and switches Oracle back to images it still holds (the last 4 per image).

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Redeploy a tag already on Oracle, e.g. 48120fd-arm64 (skips the build). Empty = build this commit.'
        required: false
        type: string

concurrency:
  group: deploy-brooks-prequel
  cancel-in-progress: false

env:
  APP: brooks

jobs:
  preflight:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      build: ${{ steps.tag.outputs.build }}
    steps:
      - name: Decide the image tag
        id: tag
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          if [ -n "$INPUT_TAG" ]; then
            echo "tag=$INPUT_TAG" >> "$GITHUB_OUTPUT"
            echo "build=false" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_SHA::7}-arm64" >> "$GITHUB_OUTPUT"
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up SSH to Oracle
        env:
          ORACLE_SSH_KEY: ${{ secrets.ORACLE_SSH_KEY }}
          ORACLE_KNOWN_HOSTS: ${{ vars.ORACLE_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$ORACLE_SSH_KEY" > ~/.ssh/oracle && chmod 600 ~/.ssh/oracle
          printf '%s\n' "$ORACLE_KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Oracle handshake
        run: ssh -i ~/.ssh/oracle -o BatchMode=yes -o ConnectTimeout=20 "${{ vars.ORACLE_SSH_USER }}@${{ vars.ORACLE_HOST }}" hello

  build:
    needs: preflight
    if: needs.preflight.outputs.build == 'true'
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
    strategy:
      fail-fast: true
      matrix:
        image: [brooks-prequel-backend, brooks-prequel-web]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build backend image (arm64)
        if: matrix.image == 'brooks-prequel-backend'
        run: |
          set -euo pipefail
          docker build --progress=plain -t "${{ matrix.image }}:${{ needs.preflight.outputs.tag }}" backend/

      - name: Authenticate to Google Cloud
        if: matrix.image == 'brooks-prequel-web'
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up gcloud
        if: matrix.image == 'brooks-prequel-web'
        uses: google-github-actions/setup-gcloud@v2

      - name: Build web image (arm64)
        if: matrix.image == 'brooks-prequel-web'
        env:
          PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          ENV_SECRET_NAME: ${{ secrets.GCP_ENV_SECRET_NAME }}
        run: |
          set -euo pipefail
          gcloud secrets versions access latest --secret="${ENV_SECRET_NAME}" --project="${PROJECT_ID}" > .env.production
          [ -s .env.production ] || { echo "ERROR: .env.production is empty after secret fetch"; exit 1; }
          get_env() {
            local key="$1"
            grep -E "^${key}=" .env.production | head -n 1 | cut -d'=' -f2- | tr -d '\r'
          }
          # next.config.js throws at production build time without GCS_BUCKET; fail loudly here instead.
          GCS_BUCKET_VALUE="$(get_env GCS_BUCKET)"
          if [ -z "$GCS_BUCKET_VALUE" ]; then
            echo "ERROR: GCS_BUCKET missing from .env.production — add it to Secret Manager"
            exit 1
          fi
          docker build \
            --progress=plain \
            --build-arg NEXT_PUBLIC_API_BASE_URL="$(get_env NEXT_PUBLIC_API_BASE_URL)" \
            --build-arg NEXT_PUBLIC_AUTH0_DOMAIN="$(get_env NEXT_PUBLIC_AUTH0_DOMAIN)" \
            --build-arg NEXT_PUBLIC_AUTH0_CLIENT_ID="$(get_env NEXT_PUBLIC_AUTH0_CLIENT_ID)" \
            --build-arg NEXT_PUBLIC_AUTH0_AUDIENCE="$(get_env NEXT_PUBLIC_AUTH0_AUDIENCE)" \
            --build-arg NEXT_PUBLIC_MAPBOX_PUBLIC_TOKEN="$(get_env NEXT_PUBLIC_MAPBOX_PUBLIC_TOKEN)" \
            --build-arg NEXT_PUBLIC_MAPBOX_STYLE="$(get_env NEXT_PUBLIC_MAPBOX_STYLE)" \
            --build-arg NEXT_PUBLIC_PATHWAY_VIEW_ENABLED="$(get_env NEXT_PUBLIC_PATHWAY_VIEW_ENABLED || true)" \
            --build-arg GCS_BUCKET="${GCS_BUCKET_VALUE}" \
            -t "${{ matrix.image }}:${{ needs.preflight.outputs.tag }}" \
            web/
          rm -f .env.production

      - name: Set up SSH to Oracle
        env:
          ORACLE_SSH_KEY: ${{ secrets.ORACLE_SSH_KEY }}
          ORACLE_KNOWN_HOSTS: ${{ vars.ORACLE_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$ORACLE_SSH_KEY" > ~/.ssh/oracle && chmod 600 ~/.ssh/oracle
          printf '%s\n' "$ORACLE_KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Ship image to Oracle
        run: |
          set -o pipefail
          docker save "${{ matrix.image }}:${{ needs.preflight.outputs.tag }}" | gzip -1 | \
            ssh -i ~/.ssh/oracle -o BatchMode=yes "${{ vars.ORACLE_SSH_USER }}@${{ vars.ORACLE_HOST }}" load "$APP"

  deploy:
    needs: [preflight, build]
    if: ${{ always() && needs.preflight.result == 'success' && (needs.preflight.outputs.build == 'false' || needs.build.result == 'success') }}
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Set up SSH to Oracle
        env:
          ORACLE_SSH_KEY: ${{ secrets.ORACLE_SSH_KEY }}
          ORACLE_KNOWN_HOSTS: ${{ vars.ORACLE_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$ORACLE_SSH_KEY" > ~/.ssh/oracle && chmod 600 ~/.ssh/oracle
          printf '%s\n' "$ORACLE_KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Deploy on Oracle
        run: ssh -i ~/.ssh/oracle -o BatchMode=yes "${{ vars.ORACLE_SSH_USER }}@${{ vars.ORACLE_HOST }}" deploy "$APP" "${{ needs.preflight.outputs.tag }}"

      - name: Recent deploys (pick a rollback tag from here)
        if: always()
        run: ssh -i ~/.ssh/oracle -o BatchMode=yes "${{ vars.ORACLE_SSH_USER }}@${{ vars.ORACLE_HOST }}" history "$APP"
